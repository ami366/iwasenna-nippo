const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(key,cls=''){return `<img class="${cls}" alt="" src="${ART[key]||ART.star}">`}
function save(){templates[active]=data;try{localStorage.setItem('routine-templates-v6',JSON.stringify(templates));localStorage.setItem('routine-active-v6',active);localStorage.setItem('routine-child-v6',$('childName').value);localStorage.setItem('routine-pink-v4',JSON.stringify(data));localStorage.setItem('routine-date-v4',JSON.stringify({year:$('year').value,month:$('month').value,day:$('day').value,note:$('note').value}))}catch(e){}}
function renderPreview(){$('nameLine').textContent=$('childName').value.trim()?$('childName').value.trim()+' の ルーティンひょう':'';$('preview').innerHTML=config.map(([k,ico,title])=>`<section class="panel ${k}"><h2>${img(ico)}<span>${title}</span></h2><div class="items ${data[k].length>9?'compact':data[k].length>7?'dense':''}">${data[k].map(([i,t])=>`<div class="row"><span class="check"></span>${img(i,'icon')}<span class="label">${esc(t)}</span></div>`).join('')}</div></section>`).join('');$('notePreview').textContent=$('note').value;requestAnimationFrame(adjustPrintLayout)}
function adjustPrintLayout(){document.querySelectorAll('.panel').forEach(panel=>{let items=panel.querySelector('.items');items.style.zoom='';const available=510-panel.querySelector('h2').offsetHeight;if(items.scrollHeight>available){items.style.zoom=Math.max(.62,available/items.scrollHeight).toFixed(2)}});$('page').dataset.overflow=document.querySelectorAll('.panel .items').length}
const collapsed={morning:false,after:false,night:false};
function toggleSection(k){collapsed[k]=!collapsed[k];renderEdit()}
function renderEdit(){$('editgrid').innerHTML=config.map(([k,ico,title])=>`<div class="editsection"><button type="button" class="section-toggle" onclick="toggleSection('${k}')" aria-expanded="${!collapsed[k]}"><span>${img(ico,"section-art")} ${title.replace('<br>','')}</span><span>${collapsed[k]?'＋ 開く':'－ 閉じる'}</span></button><div class="section-body" ${collapsed[k]?'hidden':''}>${data[k].map(([i,t],n)=>`<div class="editrow" data-drag-k="${k}" data-drag-n="${n}"><div class="editicon">${img(i)}<button onclick="openArt('${k}',${n})">🎨 ${names[i]||'イラスト'} を変更</button></div><input aria-label="やること" value="${esc(t)}" data-k="${k}" data-n="${n}" data-field="1"><button class="delete" aria-label="この項目を削除" onclick="removeRow('${k}',${n})">×</button><div class="move"><span class="draghandle" title="つかんで並べ替え" data-k="${k}" data-n="${n}">☰ 移動</span><button aria-label="上に移動" onclick="moveRow('${k}',${n},-1)">↑ 上へ</button><button aria-label="下に移動" onclick="moveRow('${k}',${n},1)">↓ 下へ</button></div></div>`).join('')}<button onclick="addRow('${k}')">＋ やることを追加</button></div></div>`).join('');$('editgrid').querySelectorAll('input,select').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{data[el.dataset.k][+el.dataset.n][+el.dataset.field]=el.value;renderPreview();save();if(el.tagName==='SELECT')renderEdit()}));setupDrag()}
function addRow(k){data[k].push(['star','あたらしい やること']);renderEdit();renderPreview();save()}function removeRow(k,n){data[k].splice(n,1);renderEdit();renderPreview();save()}function moveRow(k,n,d){let j=n+d;if(j<0||j>=data[k].length)return;[data[k][n],data[k][j]]=[data[k][j],data[k][n]];renderEdit();renderPreview();save()}function clearDate(){for(let k of ['year','month','day'])$(k).value='';save()}function resetAll(){if(!confirm('現在のテンプレートをサンプルに戻しますか？'))return;data=structuredClone(active==='weekday'?defaults:holidayDefaults);templates[active]=data;$('note').value='';clearDate();renderEdit();renderPreview();save()}
try{const d=JSON.parse(localStorage.getItem('routine-date-v4'))||{};for(const k of ['year','month','day','note'])$(k).value=d[k]||''}catch(e){}for(const k of ['year','month','day','note'])$(k).addEventListener('input',()=>{renderPreview();save()});function switchTemplate(k){if(!templates[k])return;save();active=k;data=templates[k];renderEdit();renderPreview();save()}
function setChildName(v){renderPreview();save()}
function fillToday(){const d=new Date();$('year').value=d.getFullYear();$('month').value=d.getMonth()+1;$('day').value=d.getDate();save()}
let artTarget=null;function openArt(k,n){artTarget=[k,n];$('artlist').innerHTML=Object.keys(names).map(key=>`<button class="artpick" onclick="chooseArt('${key}')">${img(key)}<span>${names[key]}</span></button>`).join('');$('artmodal').classList.add('show')}
function chooseArt(key){if(!artTarget)return;data[artTarget[0]][artTarget[1]][0]=key;closeArt();renderEdit();renderPreview();save()}
function closeArt(){$('artmodal').classList.remove('show')}
let dragState=null;
function setupDrag(){
 document.querySelectorAll('.draghandle').forEach(handle=>{
  handle.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   e.preventDefault();
   const row=handle.closest('.editrow');
   dragState={k:handle.dataset.k,from:+handle.dataset.n,over:+handle.dataset.n,pointer:e.pointerId};
   handle.setPointerCapture(e.pointerId);
   row.classList.add('dragging-active');
  });
  handle.addEventListener('pointermove',e=>{
   if(!dragState||dragState.pointer!==e.pointerId)return;
   const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.editrow');
   document.querySelectorAll('.editrow.dragover').forEach(el=>el.classList.remove('dragover'));
   if(target&&target.dataset.dragK===dragState.k){
    dragState.over=+target.dataset.dragN;
    target.classList.add('dragover');
   }
  });
  handle.addEventListener('pointerup',e=>{
   if(!dragState||dragState.pointer!==e.pointerId)return;
   const {k,from,over}=dragState;
   dragState=null;
   if(from!==over){
    const [item]=data[k].splice(from,1);
    data[k].splice(over,0,item);
    renderPreview();save();
   }
   renderEdit();
  });
  handle.addEventListener('pointercancel',()=>{
   dragState=null;
   document.querySelectorAll('.dragover,.dragging-active').forEach(el=>el.classList.remove('dragover','dragging-active'));
  });
 });
}
$('childName').value=localStorage.getItem('routine-child-v6')||'';$('template').value=active;
document.querySelectorAll('[data-art]').forEach(el=>el.src=ART[el.dataset.art]);renderEdit();renderPreview();function fit(){if(window.innerWidth<850){let scale=Math.min(1,(window.innerWidth-16)/794);$('page').style.transform=`scale(${scale})`;$('page').style.transformOrigin='top left';$('page').style.marginBottom=`${-(1-scale)*1123+20}px`;$('page').style.marginLeft='8px'}else{$('page').style.transform='';$('page').style.marginBottom='20px';$('page').style.marginLeft='auto'}}window.addEventListener('resize',fit);fit();
</script></body></html>
